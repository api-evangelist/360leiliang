aid: 360leiliang
name: 360leiliang
description: 360leiliang (辅布司 / "Fubusi") is a Chinese S2B self-operated business-to-business e-commerce platform
  for textile trim and accessories — principally lace, embroidery and knitted narrow fabrics in nylon, polyester,
  rayon and cotton — sold by the yard to garment manufacturers. The storefront and companion mobile app are owned
  and operated by 福建东南西北网络科技有限公司 (Fujian Dongnanxibei Network Technology Co., Ltd.) of Mawei District, Fuzhou, Fujian,
  China; the company was founded in 2014. 360leiliang.com lists per-pattern finished-goods and greige pricing, image-based
  product lookup, stock and made-to-order availability, and Alipay/WeChat checkout. As of this profile it publishes
  no public developer program, API documentation, machine-readable contract or SDK; api.360leiliang.com is the private
  backend for its own clients. It consumes third-party APIs — WeChat login, Alipay, JPush, Vivo/Huawei push — rather
  than producing one.
